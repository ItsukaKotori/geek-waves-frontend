<!doctype html>
<html lang="zh-CN" data-theme="gw-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GeekWaves — 极客资讯流与技术工具中心" />
    <title>GeekWaves</title>
    <script>
      // 首屏防闪烁:渲染前从 localStorage 恢复暗色主题(白名单校验)
      try {
        if (localStorage.getItem('geekwaves-theme') === 'gw-dark') {
          document.documentElement.dataset.theme = 'gw-dark'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
